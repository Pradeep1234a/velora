name: Build & Release Velora APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias velora \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass veloratracker \
            -keypass veloratracker \
            -dname "CN=Velora Tracker, OU=Mobile, O=Velora, L=Bangalore, ST=Karnataka, C=IN"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: veloratracker
          KEY_ALIAS: velora
          KEY_PASSWORD: veloratracker
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/Velora-v1.0.${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/velora-release.apk

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velora-v1.0.${{ github.run_number }}-apk
          path: release-artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Velora Tracker v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Velora Tracker v1.0.${{ github.run_number }}
            
            Automatic release build for **Velora Tracker**.
            
            ### ⬇️ Download
            - **[Direct Release APK (velora-release.apk)](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/velora-release.apk)**
            - **[Versioned APK (Velora-v1.0.${{ github.run_number }}.apk)](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/Velora-v1.0.${{ github.run_number }}.apk)**
            
            ### 📋 Build Details
            - **Version Code**: `${{ github.run_number }}` (auto-incremented)
            - **Version Name**: `1.0.${{ github.run_number }}`
            - **Build Type**: Release (Production signed APK)
            - **Commit**: `${{ github.sha }}`
          files: |
            release-artifacts/Velora-v1.0.${{ github.run_number }}.apk
            release-artifacts/velora-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
