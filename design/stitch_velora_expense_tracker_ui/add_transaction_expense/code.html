</div>

<!-- Smart Category AI Pill Assistant -->

<div class="flex items-center gap-2 min-w-0">

<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>

<button class="px-2 py-0.5 rounded-full bg-primary text-on-primary font-label-sm text-label-sm shrink-0 active:scale-95 transition-transform flex items-center gap-1" onclick="applySuggestion()" type="button">
<span class="material-symbols-outlined text-[13px]">check</span>
<span>Applied</span>
</button>
</div>
</div>
<!-- Category Selector Drawer Trigger -->
<div class="w-full bg-surface-container-lowest rounded-xl p-3 shadow-sm flex items-center justify-between cursor-pointer active:bg-surface-container-low transition-colors">
<div class="flex items-center gap-3 min-w-0">

<span class="material-symbols-outlined text-[22px]">restaurant</span>
</div>
<div class="min-w-0">
<span class="block font-label-sm text-label-sm text-on-surface-variant">Category</span>
<span class="block font-title-md text-title-md text-on-surface font-semibold truncate">🍔 Food &amp; Dining</span>
</div>
</div>
<div class="flex items-center gap-1 text-outline">
<span class="font-label-sm text-label-sm">Change</span>

</div>

<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant shrink-0">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
</div>
<div class="min-w-0">

</div>
</div>
<div class="bg-surface-container-lowest rounded-xl p-3 shadow-sm flex items-center gap-2.5 cursor-pointer active:bg-surface-container-low transition-colors">
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant shrink-0">
<span class="material-symbols-outlined text-[18px]">schedule</span>
</div>
<div class="min-w-0">
<span class="block font-label-sm text-label-sm text-on-surface-variant">Time</span>
<span class="block font-body-md text-body-md font-semibold text-on-surface truncate">1:20 PM</span>
</div>
</div>
</div>
<!-- Payment Method Filter Chips -->
<div class="flex flex-col gap-1.5">

<div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5">
<button class="pay-chip active-chip px-3.5 py-1.5 rounded-full bg-primary text-on-primary font-label-md text-label-md shrink-0 flex items-center gap-1.5 shadow-sm transition-all" onclick="selectPayment(this)" type="button">
<span class="material-symbols-outlined text-[16px]">payments</span>
<span>Cash</span>
</button>
<button class="pay-chip px-3.5 py-1.5 rounded-full bg-surface-container-lowest text-on-surface font-label-md text-label-md shrink-0 flex items-center gap-1.5 shadow-sm hover:bg-surface-container transition-all" onclick="selectPayment(this)" type="button">
<span class="material-symbols-outlined text-[16px]">qr_code_scanner</span>
<span>UPI</span>
</button>
<button class="pay-chip px-3.5 py-1.5 rounded-full bg-surface-container-lowest text-on-surface font-label-md text-label-md shrink-0 flex items-center gap-1.5 shadow-sm hover:bg-surface-container transition-all" onclick="selectPayment(this)" type="button">
<span class="material-symbols-outlined text-[16px]">credit_card</span>
<span>Debit Card</span>
</button>
<button class="pay-chip px-3.5 py-1.5 rounded-full bg-surface-container-lowest text-on-surface font-label-md text-label-md shrink-0 flex items-center gap-1.5 shadow-sm hover:bg-surface-container transition-all" onclick="selectPayment(this)" type="button">
<span class="material-symbols-outlined text-[16px]">credit_score</span>
<span>Credit Card</span>
</button>
<button class="pay-chip px-3.5 py-1.5 rounded-full bg-surface-container-lowest text-on-surface font-label-md text-label-md shrink-0 flex items-center gap-1.5 shadow-sm hover:bg-surface-container transition-all" onclick="selectPayment(this)" type="button">
<span class="material-symbols-outlined text-[16px]">account_balance</span>
<span>Bank</span>
</button>
</div>

<!-- Notes & Meta Input -->

<span class="material-symbols-outlined text-outline text-[18px]">edit_note</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" placeholder="Add short note or #tags (optional)..." type="text"/>
</div>

<!-- Embedded Soft Numeric Keypad -->
<div class="w-full bg-surface-container-low rounded-2xl p-3 shadow-inner mb-4">
<div class="grid grid-cols-3 gap-2">
<button class="h-12 rounded-xl bg-surface-container-lowest active:bg-surface-container font-title-lg text-title-lg text-on-surface font-semibold flex items-center justify-center shadow-sm" onclick="keyPress('1')" type="button">1</button>
<button class="h-12 rounded-xl bg-surface-container-lowest active:bg-surface-container font-title-lg text-title-lg text-on-surface font-semibold flex items-center justify-center shadow-sm" onclick="keyPress('2')" type="button">2</button>
<button class="h-12 rounded-xl bg-surface-container-lowest active:bg-surface-container font-title-lg text-title-lg text-on-surface font-semibold flex items-center justify-center shadow-sm" onclick="keyPress('3')" type="button">3</button>
<button class="h-12 rounded-xl bg-surface-container-lowest active:bg-surface-container font-title-lg text-title-lg text-on-surface font-semibold flex items-center justify-center shadow-sm" onclick="keyPress('4')" type="button">4</button>
<button class="h-12 rounded-xl bg-surface-container-lowest active:bg-surface-container font-title-lg text-title-lg text-on-surface font-semibold flex items-center justify-center shadow-sm" onclick="keyPress('5')" type="button">5</button>
<button class="h-12 rounded-xl bg-surface-container-lowest active:bg-surface-container font-title-lg text-title-lg text-on-surface font-semibold flex items-center justify-center shadow-sm" onclick="keyPress('6')" type="button">6</button>
<button class="h-12 rounded-xl bg-surface-container-lowest active:bg-surface-container font-title-lg text-title-lg text-on-surface font-semibold flex items-center justify-center shadow-sm" onclick="keyPress('7')" type="button">7</button>
<button class="h-12 rounded-xl bg-surface-container-lowest active:bg-surface-container font-title-lg text-title-lg text-on-surface font-semibold flex items-center justify-center shadow-sm" onclick="keyPress('8')" type="button">8</button>
<button class="h-12 rounded-xl bg-surface-container-lowest active:bg-surface-container font-title-lg text-title-lg text-on-surface font-semibold flex items-center justify-center shadow-sm" onclick="keyPress('9')" type="button">9</button>
<button class="h-12 rounded-xl bg-surface-container-lowest active:bg-surface-container font-title-lg text-title-lg text-on-surface font-semibold flex items-center justify-center shadow-sm" onclick="keyPress('.')" type="button">.</button>
<button class="h-12 rounded-xl bg-surface-container-lowest active:bg-surface-container font-title-lg text-title-lg text-on-surface font-semibold flex items-center justify-center shadow-sm" onclick="keyPress('0')" type="button">0</button>
<button class="h-12 rounded-xl bg-surface-container-lowest active:bg-surface-container text-on-surface flex items-center justify-center shadow-sm" onclick="keyPress('back')" type="button">
<span class="material-symbols-outlined text-[22px]">backspace</span>
</button>

<!-- Primary Save CTA Button -->
<button class="w-full h-13 py-3.5 rounded-2xl bg-primary hover:bg-primary-container text-on-primary font-title-md text-title-md font-bold tracking-tight shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="save-tx-btn" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span id="save-label">Save Expense (₹350)</span>
</button>
</div>
<script>
  let currentAmount = "350";

  function updateDisplay() {
    const disp = document.getElementById('display-amount');
    const btn = document.getElementById('save-label');
    const finalVal = currentAmount === "" || currentAmount === "0" ? "0" : currentAmount;
    disp.textContent = finalVal;
    btn.textContent = `Save Expense (₹${finalVal})`;
  }

  function keyPress(val) {
    if (val === 'back') {
      currentAmount = currentAmount.slice(0, -1);
      if (currentAmount === "") currentAmount = "0";
    } else if (val === '.') {
      if (!currentAmount.includes('.')) {
        currentAmount += '.';
      }
    } else {
      if (currentAmount === "0") {
        currentAmount = val;
      } else {
        if (currentAmount.length < 9) {
          currentAmount += val;
        }
      }
    }
    updateDisplay();
  }

  function adjustAmount(val) {
    let num = parseFloat(currentAmount) || 0;
    num += val;
    currentAmount = num.toString();
    updateDisplay();
  }

  function selectPayment(target) {
    document.querySelectorAll('.pay-chip').forEach(el => {
      el.classList.remove('bg-primary', 'text-on-primary');
      el.classList.add('bg-surface-container-lowest', 'text-on-surface');
    });
    target.classList.remove('bg-surface-container-lowest', 'text-on-surface');
    target.classList.add('bg-primary', 'text-on-primary');
  }

  function applySuggestion() {
    const chip = document.getElementById('ai-chip');
    chip.classList.add('bg-secondary-container', 'text-on-secondary-container');
    setTimeout(() => {
      chip.classList.remove('bg-secondary-container', 'text-on-secondary-container');
    }, 800);
  }

  document.getElementById('reset-form-btn').addEventListener('click', () => {
    currentAmount = "0";
    document.getElementById('tx-title').value = "";
    updateDisplay();
  });

  const expTab = document.getElementById('tab-expense');
  const incTab = document.getElementById('tab-income');

  incTab.addEventListener('click', () => {
    incTab.classList.add('bg-primary', 'text-on-primary');
    incTab.classList.remove('text-on-surface-variant');
    expTab.classList.remove('bg-error', 'text-on-error');
    expTab.classList.add('text-on-surface-variant');
    const finalVal = currentAmount === "" ? "0" : currentAmount;
    document.getElementById('save-label').textContent = `Save Income (₹${finalVal})`;
  });

  expTab.addEventListener('click', () => {
    expTab.classList.add('bg-error', 'text-on-error');
    expTab.classList.remove('text-on-surface-variant');
    incTab.classList.remove('bg-primary', 'text-on-primary');
    incTab.classList.add('text-on-surface-variant');
    const finalVal = currentAmount === "" ? "0" : currentAmount;
    document.getElementById('save-label').textContent = `Save Expense (₹${finalVal})`;
  });
</script></main></body></html>
