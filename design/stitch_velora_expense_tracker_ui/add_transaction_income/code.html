ellular_alt</span><span class="material-symbols-outlined text-[14px]">wifi</span><span class="material-symbols-outlined text-[14px]">battery_full</span></div></div><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-compact"><button aria-label="Navigate back" class="w-11 h-11 -ml-2 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><img alt="Velora Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1U_e7PpWBZMhC0QZDxmFTC1mWsaPlyrPVhffyLEFzvVpwq7nYSL15xd-pBDXtwgqiI8Mat8L9X10C5Yz4xpZ10BM-NQORtS1UGgnxw_98T813_KeTAqfE1ux_tAgsCXNMsPHeMW1NveXEy4lpaz-c_ZrwCPo_kzLxr39XZlG48M_B2hmsyHSpyAa1xY-2rrVtb9owGEyBdaCzbyWyYS1Cfft0gIyvZXyXCYO0DDVTTR00gVOYhaVkEue1Y"/><h1 class="font-title-lg text-title-lg text-on-surface leading-tight tracking-tight">New Transaction</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full pb-8 select-none">

<button class="px-2.5 py-1 rounded-lg bg-surface-container text-on-surface-variant font-label-sm text-label-sm active:scale-95 transition-transform" onclick="addAmount(500)" type="button">+₹500</button>
<button class="px-2.5 py-1 rounded-lg bg-surface-container text-on-surface-variant font-label-sm text-label-sm active:scale-95 transition-transform" onclick="addAmount(1000)" type="button">+₹1,000</button>
<button class="px-2.5 py-1 rounded-lg bg-surface-container text-on-surface-variant font-label-sm text-label-sm active:scale-95 transition-transform" onclick="addAmount(5000)" type="button">+₹5,000</button>
</div>
</div>
<!-- Details Card Container -->
<div class="bg-surface-container-lowest rounded-2xl p-4 shadow-sm space-y-3 mb-4">

<div class="flex flex-col gap-1">

<div class="flex items-center gap-2 bg-surface-container-low px-3 py-2.5 rounded-xl focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#16803C] transition-all">
<span class="material-symbols-outlined text-outline text-[20px]">edit_note</span>
<input class="w-full bg-transparent font-title-md text-title-md text-on-surface focus:outline-none placeholder:text-outline" id="input-title" placeholder="e.g. Salary, Client Payout" type="text" value="Monthly Consulting Retainer"/>
</div>
</div>
<!-- AI Suggestion Pill -->
<button class="w-full flex items-center justify-between px-3 py-2 rounded-xl bg-surface-container-low text-left active:bg-surface-container transition-colors" type="button">
<div class="flex items-center gap-2 min-w-0">
<span class="text-base">✨</span>
<span class="font-label-sm text-label-sm text-on-surface truncate">Auto-matched: <span class="font-semibold text-primary">💼 Freelance &amp; Consulting</span></span>
</div>
<span class="font-label-sm text-label-sm text-[#16803C] font-semibold flex items-center shrink-0">Apply</span>
</button>
<!-- Category Selector Row -->
<div class="flex items-center justify-between pt-1">
<span class="font-label-md text-label-md text-on-surface-variant">Category</span>
<button class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface active:scale-95 transition-all" type="button">
<div class="w-6 h-6 rounded-full bg-[#16803C]/10 flex items-center justify-center text-[#16803C]">
<span class="material-symbols-outlined text-[15px]">work</span>
</div>
<span class="font-label-lg text-label-lg font-medium">Work &amp; Salary</span>
<span class="material-symbols-outlined text-outline text-[16px]">chevron_right</span>
</button>
</div>
<div class="h-[1px] bg-surface-container-low"></div>
<!-- Date & Time Row -->
<div class="grid grid-cols-2 gap-2">
<div class="flex flex-col gap-1">
<span class="font-label-sm text-label-sm text-outline">Date</span>
<button class="flex items-center gap-2 px-3 py-2 rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container transition-colors text-left" type="button">
<span class="material-symbols-outlined text-outline text-[18px]">calendar_today</span>
<span class="font-label-md text-label-md font-medium truncate">Today, Oct 24</span>
</button>
</div>
<div class="flex flex-col gap-1">
<span class="font-label-sm text-label-sm text-outline">Time</span>
<button class="flex items-center gap-2 px-3 py-2 rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container transition-colors text-left" type="button">
<span class="material-symbols-outlined text-outline text-[18px]">schedule</span>
<span class="font-label-md text-label-md font-medium truncate">09:00 AM</span>
</button>
</div>
</div>
<!-- Payment Method Selector -->
<div class="flex flex-col gap-1.5 pt-1">
<span class="font-label-sm text-label-sm text-outline">Destination Account</span>
<div class="flex items-center gap-2 overflow-x-auto pb-0.5">
<button class="account-pill active-account shrink-0 px-3 py-1.5 rounded-full bg-[#16803C] text-on-primary font-label-md text-label-md flex items-center gap-1.5 shadow-sm" type="button">
<span class="material-symbols-outlined text-[15px]">account_balance</span>
          Bank Transfer
        </button>
<button class="account-pill shrink-0 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md flex items-center gap-1.5 active:bg-surface-container-high" type="button">
<span class="material-symbols-outlined text-[15px]">qr_code_scanner</span>
          UPI
        </button>
<button class="account-pill shrink-0 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md flex items-center gap-1.5 active:bg-surface-container-high" type="button">
<span class="material-symbols-outlined text-[15px]">payments</span>
          Cash
        </button>
<button class="account-pill shrink-0 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md flex items-center gap-1.5 active:bg-surface-container-high" type="button">
<span class="material-symbols-outlined text-[15px]">receipt_long</span>
          Cheque
        </button>
</div>
</div>
<!-- Notes Field -->
<div class="flex flex-col gap-1 pt-1">
<label class="font-label-sm text-label-sm text-outline">Memo / Reference</label>
<div class="flex items-center gap-2 bg-surface-container-low px-3 py-2 rounded-xl">
<span class="material-symbols-outlined text-outline text-[18px]">tag</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface focus:outline-none placeholder:text-outline" placeholder="Add invoice number or reference..." type="text" value="Invoice #INV-2024-10 approved"/>
</div>
</div>

<!-- Client Side Keypad and Quick Submit Panel -->
<div class="bg-surface-container-lowest rounded-2xl p-3 shadow-sm mb-4">
<!-- Keypad Grid -->
<div class="grid grid-cols-3 gap-2 text-center select-none font-title-lg text-title-lg font-semibold text-on-surface">
<button class="h-12 rounded-xl bg-surface hover:bg-surface-container active:bg-surface-container-high flex items-center justify-center transition-colors" onclick="tapKey('1')" type="button">1</button>
<button class="h-12 rounded-xl bg-surface hover:bg-surface-container active:bg-surface-container-high flex items-center justify-center transition-colors" onclick="tapKey('2')" type="button">2</button>
<button class="h-12 rounded-xl bg-surface hover:bg-surface-container active:bg-surface-container-high flex items-center justify-center transition-colors" onclick="tapKey('3')" type="button">3</button>
<button class="h-12 rounded-xl bg-surface hover:bg-surface-container active:bg-surface-container-high flex items-center justify-center transition-colors" onclick="tapKey('4')" type="button">4</button>
<button class="h-12 rounded-xl bg-surface hover:bg-surface-container active:bg-surface-container-high flex items-center justify-center transition-colors" onclick="tapKey('5')" type="button">5</button>
<button class="h-12 rounded-xl bg-surface hover:bg-surface-container active:bg-surface-container-high flex items-center justify-center transition-colors" onclick="tapKey('6')" type="button">6</button>
<button class="h-12 rounded-xl bg-surface hover:bg-surface-container active:bg-surface-container-high flex items-center justify-center transition-colors" onclick="tapKey('7')" type="button">7</button>
<button class="h-12 rounded-xl bg-surface hover:bg-surface-container active:bg-surface-container-high flex items-center justify-center transition-colors" onclick="tapKey('8')" type="button">8</button>
<button class="h-12 rounded-xl bg-surface hover:bg-surface-container active:bg-surface-container-high flex items-center justify-center transition-colors" onclick="tapKey('9')" type="button">9</button>
<button class="h-12 rounded-xl bg-surface hover:bg-surface-container active:bg-surface-container-high flex items-center justify-center text-outline transition-colors" onclick="tapKey('.')" type="button">.</button>
<button class="h-12 rounded-xl bg-surface hover:bg-surface-container active:bg-surface-container-high flex items-center justify-center transition-colors" onclick="tapKey('0')" type="button">0</button>
<button aria-label="Backspace" class="h-12 rounded-xl bg-surface hover:bg-surface-container active:bg-surface-container-high flex items-center justify-center text-on-surface-variant transition-colors" onclick="backspaceKey()" type="button">
<span class="material-symbols-outlined text-[22px]">backspace</span>
</button>
</div>
</div>
<!-- Primary Action Save Button -->
<button class="w-full h-13 py-3.5 rounded-2xl bg-[#16803C] hover:bg-[#126931] active:scale-[0.98] transition-all shadow-[0_8px_20px_-4px_rgba(22,128,60,0.35)] flex items-center justify-center gap-2 text-on-primary" id="btn-save-transaction" type="button">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
<span class="font-title-md text-title-md font-semibold tracking-wide" id="save-button-label">Save Income (+₹60,000)</span>
</button>
</div>
<script>
  let rawAmount = "60000";

  function formatDisplay(val) {
    if (!val || val === "0") return "0";
    const num = parseFloat(val);
    if (isNaN(num)) return "0";
    return num.toLocaleString('en-IN');
  }

  function updateDisplays() {
    const formatted = formatDisplay(rawAmount);
    const amountEl = document.getElementById("amount-val");
    const saveBtnLabel = document.getElementById("save-button-label");
    if (amountEl) amountEl.innerText = formatted;
    if (saveBtnLabel) saveBtnLabel.innerText = "Save Income (+₹" + formatted + ")";
  }

  function tapKey(k) {
    if (rawAmount === "0" && k !== ".") {
      rawAmount = k;
    } else if (k === "." && rawAmount.includes(".")) {
      return;
    } else if (rawAmount.length < 10) {
      rawAmount += k;
    }
    updateDisplays();
  }

  function backspaceKey() {
    if (rawAmount.length > 1) {
      rawAmount = rawAmount.slice(0, -1);
    } else {
      rawAmount = "0";
    }
    updateDisplays();
  }

  function addAmount(delta) {
    let current = parseFloat(rawAmount) || 0;
    current += delta;
    rawAmount = current.toString();
    updateDisplays();
  }

  document.getElementById("btn-clear-all")?.addEventListener("click", () => {
    rawAmount = "0";
    updateDisplays();
  });

  // Account selector tabs
  const accountPills = document.querySelectorAll(".account-pill");
  accountPills.forEach(pill => {
    pill.addEventListener("click", () => {
      accountPills.forEach(p => {
        p.className = "account-pill shrink-0 px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md flex items-center gap-1.5 active:bg-surface-container-high transition-colors";
      });
      pill.className = "account-pill shrink-0 px-3 py-1.5 rounded-full bg-[#16803C] text-on-primary font-label-md text-label-md flex items-center gap-1.5 shadow-sm transition-colors";
    });
  });

  // Submit feedback
  document.getElementById("btn-save-transaction")?.addEventListener("click", function() {
    this.classList.add("scale-95");
    const originalText = document.getElementById("save-button-label").innerText;
    document.getElementById("save-button-label").innerText = "Income Recorded!";
    setTimeout(() => {
      this.classList.remove("scale-95");
      document.getElementById("save-button-label").innerText = originalText;
    }, 1200);
  });
</script></main></body></html>
