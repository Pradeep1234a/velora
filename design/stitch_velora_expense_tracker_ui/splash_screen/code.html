<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Velora Tracker — Splash Screen Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      background-color: #001219;
      color: #E2E8F0;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
    }
    .velora-canvas-bg {
      background: radial-gradient(circle at 65% 25%, #003840 0%, #001F2A 50%, #001219 100%);
    }
    .wordmark-font {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      letter-spacing: -0.03em;
    }
    .glow-radial {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(6, 182, 212, 0.08) 45%, rgba(0, 31, 42, 0) 70%);
    }
    input[type=range] {
      -webkit-appearance: none;
      background: #1E293B;
      height: 4px;
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #10B981;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }
  </style>
</head>

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    const svgElementsLayer = document.getElementById('elementsLayer');
    const finalLogoGroup = document.getElementById('finalLogoGroup');
    const wordmarkBlock = document.getElementById('wordmarkBlock');
    const ambientGlow = document.getElementById('ambientGlow');
    const timingBadge = document.getElementById('timingBadge');
    const phaseLabel = document.getElementById('phaseLabel');
    const scrubber = document.getElementById('timeScrubber');
    const btnPlay = document.getElementById('btnPlay');
    const btnRestart = document.getElementById('btnRestart');
    const chkReducedMotion = document.getElementById('chkReducedMotion');
    const chkShowWireframes = document.getElementById('chkShowWireframes');
    const playIcon = document.getElementById('playIcon');

    const renderedNodes = LOGO_ELEMENTS.map(elem => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('id', elem.id);

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', elem.d);
      path.setAttribute('fill', elem.fill);

      g.appendChild(path);
      svgElementsLayer.appendChild(g);
      return { data: elem, node: g, path: path };
    });

    let currentTimestamp = 0;
    let isPlaying = true;
    let lastTime = null;

    function updateAnimationState(ms) {
      currentTimestamp = Math.min(Math.max(ms, 0), 2400);
      timingBadge.textContent = `${Math.round(currentTimestamp)}ms / 2400ms`;
      scrubber.value = currentTimestamp;

      if (currentTimestamp < 300) {
        phaseLabel.textContent = 'Frame 1: Initial Seeds (0–300ms)';
      } else if (currentTimestamp < 700) {
        phaseLabel.textContent = 'Frame 2: Approaching Coordinates (300–700ms)';
      } else if (currentTimestamp < 1250) {
        phaseLabel.textContent = 'Frame 3: V-Stem Constructing (700–1250ms)';
      } else if (currentTimestamp < 1700) {
        phaseLabel.textContent = 'Frame 4: Leaves Assembling (1250–1700ms)';
      } else if (currentTimestamp < 2050) {
        phaseLabel.textContent = 'Frame 5: Geometry Locked & Glow (1700–2050ms)';
      } else {
        phaseLabel.textContent = 'Frame 6: Final Velora Identity (2050–2400ms)';
      }

      const reducedMotion = chkReducedMotion.checked;

      if (reducedMotion) {
        const fadeProgress = easeOutCubic(Math.min(currentTimestamp / 600, 1.0));
        renderedNodes.forEach(rn => rn.node.style.opacity = '0');
        finalLogoGroup.style.opacity = fadeProgress;
        
        if (currentTimestamp >= 600) {
          const wmProg = easeOutCubic(Math.min((currentTimestamp - 600) / 400, 1.0));
          wordmarkBlock.style.opacity = wmProg;
          wordmarkBlock.style.transform = `translateY(${(1 - wmProg) * 10}px)`;
        } else {
          wordmarkBlock.style.opacity = '0';
          wordmarkBlock.style.transform = 'translateY(10px)';
        }
        return;
      }

      const showWireframes = chkShowWireframes.checked;

      renderedNodes.forEach(({ data, node, path }) => {
        if (currentTimestamp < data.delay) {
          node.style.opacity = '0';
          return;
        }

        const elapsed = currentTimestamp - data.delay;
        const progressRaw = Math.min(elapsed / data.duration, 1.0);
        const progress = easeOutCubic(progressRaw);

        const currentX = data.startX + (data.endX - data.startX) * progress;
        const currentY = data.startY + (data.endY - data.startY) * progress;
        const scale = data.startScale + (data.endScale - data.startScale) * progress;
        const opacity = data.startOpacity + (data.endOpacity - data.startOpacity) * progress;
        const rotation = data.rotation * (1.0 - progress);

        node.setAttribute('transform', `translate(${currentX}, ${currentY}) rotate(${rotation}) scale(${scale})`);
        node.style.opacity = opacity;

        if (showWireframes) {
          path.setAttribute('stroke', '#38BDF8');
          path.setAttribute('stroke-width', '1');
        } else {
          path.removeAttribute('stroke');
          path.removeAttribute('stroke-width');
        }
      });

      if (currentTimestamp >= 1550) {
        const fusionProg = easeOutCubic(Math.min((currentTimestamp - 1550) / 350, 1.0));
        finalLogoGroup.style.opacity = fusionProg;
        ambientGlow.style.opacity = fusionProg * 0.9;
        
        const fragmentFade = 1.0 - fusionProg;
        renderedNodes.forEach(rn => rn.node.style.opacity = fragmentFade);
      } else {
        finalLogoGroup.style.opacity = '0';
        ambientGlow.style.opacity = '0';
      }

      if (currentTimestamp >= 2000) {
        const wordmarkProg = easeOutCubic(Math.min((currentTimestamp - 2000) / 380, 1.0));
        wordmarkBlock.style.opacity = wordmarkProg;
        wordmarkBlock.style.transform = `translateY(${(1 - wordmarkProg) * 12}px)`;
      } else {
        wordmarkBlock.style.opacity = '0';
        wordmarkBlock.style.transform = 'translateY(12px)';
      }
    }

    function tick(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = timestamp - lastTime;
      lastTime = timestamp;

      if (isPlaying) {
        currentTimestamp += dt;
        if (currentTimestamp >= 2400) {
          currentTimestamp = 2400;
          isPlaying = false;
          playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
        updateAnimationState(currentTimestamp);
      }

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);

    btnPlay.addEventListener('click', () => {
      if (currentTimestamp >= 2400) {
        currentTimestamp = 0;
      }
      isPlaying = !isPlaying;
      playIcon.innerHTML = isPlaying 
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    });

    btnRestart.addEventListener('click', () => {
      currentTimestamp = 0;
      isPlaying = true;
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    });

    scrubber.addEventListener('input', (e) => {
      isPlaying = false;
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      updateAnimationState(parseFloat(e.target.value));
    });

    chkReducedMotion.addEventListener('change', () => updateAnimationState(currentTimestamp));
    chkShowWireframes.addEventListener('change', () => updateAnimationState(currentTimestamp));
  </script>
</body>
</html>
